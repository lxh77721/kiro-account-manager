services:
  kiro-web-proxy:
    build:
      context: .
      dockerfile: Dockerfile.web-proxy
    container_name: kiro-web-proxy
    init: true
    restart: unless-stopped
    ports:
      - "3080:3080"
      - "5580:5580"
    environment:
      NODE_ENV: production
      KIRO_WEB_HOST: 0.0.0.0
      KIRO_WEB_PORT: 3080
      KIRO_PROXY_HOST: 0.0.0.0
      KIRO_PROXY_PORT: 5580
      KIRO_USER_DATA_PATH: /data
      KIRO_WEB_ADMIN_TOKEN: change-me
      KIRO_PROXY_API_KEY: ""
    volumes:
      - ./data/web-proxy:/data
